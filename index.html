<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本云盘</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
}
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: #f8fafc;
  margin: 0;
}
/* 顶部导航 */
.top-bar {
  background-color: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.top-bar h1 {
  font-size: 18px;
  margin: 0;
  font-weight: 600;
}
/* 左侧边栏 */
.sidebar {
  width: 260px;
  background-color: #ffffff;
  border-right: 1px solid #e5e7eb;
  height: calc(100vh - 57px);
  padding: 16px;
  position: fixed;
  top: 57px;
  left: 0;
  overflow-y: auto;
}
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.sidebar-header .btn {
  font-size: 13px;
  padding: 4px 8px;
}
.search-box {
  margin-bottom: 16px;
}
.search-box input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  font-size: 14px;
}
/* 文件树样式 */
.folder-tree {
  list-style: none;
  padding: 0;
  margin: 0;
}
.tree-item {
  margin: 4px 0;
}
.tree-item .folder-toggle {
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}
.tree-item .folder-toggle:hover {
  background-color: #f1f5f9;
}
.tree-item .folder-toggle.active {
  background-color: #eff6ff;
  color: #1d4ed8;
}
.tree-item .folder-toggle i {
  font-size: 16px;
}
.tree-item .children {
  list-style: none;
  padding-left: 20px;
  margin: 0;
  display: none;
}
.tree-item .children.open {
  display: block;
}
.tree-item .file {
  padding: 6px 8px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  cursor: pointer;
}
.tree-item .file:hover {
  background-color: #f1f5f9;
}
.tree-item .file.active {
  background-color: #eff6ff;
  color: #1d4ed8;
}
/* 主内容区 */
.main-content {
  margin-left: 260px;
  padding: 40px;
  min-height: calc(100vh - 57px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.main-content.empty-state {
  text-align: center;
}
.main-content.empty-state .icon {
  font-size: 64px;
  color: #d1d5db;
  margin-bottom: 16px;
}
.main-content.empty-state h2 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 8px;
}
.main-content.empty-state p {
  color: #6b7280;
  margin-bottom: 24px;
}
.main-content .btn-group {
  display: flex;
  gap: 12px;
}
/* 编辑区样式 */
.editor-area {
  width: 100%;
  max-width: 900px;
}
.editor-area .title-input {
  width: 100%;
  padding: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 18px;
  font-weight: 600;
}
.editor-area .content-editor {
  width: 100%;
  min-height: 400px;
  padding: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background-color: #ffffff;
}
.editor-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.editor-toolbar button {
  padding: 6px 12px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  background-color: #ffffff;
  cursor: pointer;
}
.editor-toolbar button:hover {
  background-color: #f1f5f9;
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
  <button class="btn btn-light" onclick="toggleSidebar()">☰</button>
  <h1>文本云盘</h1>
</div>

<!-- 左侧边栏 -->
<div class="sidebar">
  <div class="sidebar-header">
    <span>文件管理</span>
    <div>
      <button class="btn btn-success btn-sm" onclick="createNewFile()">📄 +</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="createNewFolder()">📁 +</button>
    </div>
  </div>
  <div class="search-box">
    <input type="text" placeholder="搜索文件..." oninput="filterFiles(this.value)">
  </div>
  <ul class="folder-tree" id="folderTree"></ul>
</div>

<!-- 主内容区 -->
<div class="main-content" id="mainContent">
  <!-- 空状态 -->
  <div class="empty-state" id="emptyState">
    <div class="icon">📁</div>
    <h2>选择或新建文件开始编辑</h2>
    <p>从左侧文件列表点击文件，或点击下方按钮新建一个。</p>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="createNewFile()">新建文件</button>
      <button class="btn btn-light" onclick="createNewFolder()">新建文件夹</button>
    </div>
  </div>

  <!-- 编辑区 -->
  <div class="editor-area" id="editorArea" style="display: none;">
    <div class="editor-toolbar">
      <button onclick="document.execCommand('bold')">B 加粗</button>
      <button onclick="document.execCommand('italic')">I 斜体</button>
      <button onclick="document.execCommand('justifyLeft')">左对齐</button>
      <button onclick="document.execCommand('justifyCenter')">居中</button>
      <button onclick="document.execCommand('justifyRight')">右对齐</button>
      <button class="btn btn-primary btn-sm" onclick="saveCurrentFile()">💾 保存</button>
    </div>
    <input type="text" class="title-input" id="noteTitle" placeholder="文件标题">
    <div class="content-editor" id="noteContent" contenteditable="true"></div>
  </div>
</div>

<script>
// 数据存储
let fileTree = {};
let currentFolder = null;
let currentFile = null;

// 初始化数据
function initData() {
  const saved = localStorage.getItem("fileTree");
  if (saved) {
    fileTree = JSON.parse(saved);
  } else {
    // 示例数据，和截图保持一致
    fileTree = {
      "1020 打印机": [],
      "2025云仓考察": [],
      "人物关系": [],
      "食品": [],
      "影视仓": [],
      "GitHub": [],
      "HOME-IPTV": []
    };
    saveTree();
  }
  renderTree();
}

// 保存文件树到本地存储
function saveTree() {
  localStorage.setItem("fileTree", JSON.stringify(fileTree));
}

// 渲染文件树
function renderTree() {
  const treeEl = document.getElementById("folderTree");
  treeEl.innerHTML = "";
  for (let folderName in fileTree) {
    const li = document.createElement("li");
    li.className = "tree-item";
    li.innerHTML = `
      <div class="folder-toggle ${currentFolder === folderName ? 'active' : ''}" onclick="toggleFolder(this)">
        <span class="toggle-icon">▶</span>
        <span>📁</span>
        <span>${folderName}</span>
      </div>
      <ul class="children">
        ${fileTree[folderName].map(file => `
          <li class="file ${currentFile?.folder === folderName && currentFile?.name === file ? 'active' : ''}" onclick="openFile('${folderName}', '${file}')">
            📄 ${file}
          </li>
        `).join('')}
      </ul>
    `;
    treeEl.appendChild(li);
  }
}

// 切换文件夹展开/收起
function toggleFolder(el) {
  const children = el.nextElementSibling;
  const icon = el.querySelector(".toggle-icon");
  children.classList.toggle("open");
  icon.textContent = children.classList.contains("open") ? "▼" : "▶";
  // 选中文件夹
  currentFolder = el.textContent.trim();
  renderTree();
}

// 新建文件夹
function createNewFolder() {
  const name = prompt("请输入文件夹名称：");
  if (!name || name.trim() === "") return;
  if (fileTree[name]) {
    alert("文件夹已存在！");
    return;
  }
  fileTree[name] = [];
  saveTree();
  renderTree();
}

// 新建文件（需要先选中文件夹）
function createNewFile() {
  if (!currentFolder) {
    alert("请先在左侧选中一个文件夹！");
    return;
  }
  const name = prompt("请输入文件名称：");
  if (!name || name.trim() === "") return;
  if (fileTree[currentFolder].includes(name)) {
    alert("该文件夹下已存在同名文件！");
    return;
  }
  fileTree[currentFolder].push(name);
  saveTree();
  // 打开新建的文件
  openFile(currentFolder, name);
  renderTree();
}

// 打开文件
function openFile(folder, name) {
  currentFile = { folder, name };
  currentFolder = folder;
  // 切换到编辑区
  document.getElementById("emptyState").style.display = "none";
  document.getElementById("editorArea").style.display = "block";
  // 加载文件内容
  const content = localStorage.getItem(`file_${folder}_${name}`) || "";
  document.getElementById("noteTitle").value = name;
  document.getElementById("noteContent").innerHTML = content;
  renderTree();
}

// 保存当前文件
function saveCurrentFile() {
  if (!currentFile) return;
  const name = document.getElementById("noteTitle").value;
  const content = document.getElementById("noteContent").innerHTML;
  // 如果标题修改了，同步更新文件名
  if (name !== currentFile.name) {
    const index = fileTree[currentFile.folder].indexOf(currentFile.name);
    if (index !== -1) {
      fileTree[currentFile.folder][index] = name;
      saveTree();
    }
    localStorage.removeItem(`file_${currentFile.folder}_${currentFile.name}`);
    currentFile.name = name;
  }
  localStorage.setItem(`file_${currentFile.folder}_${name}`, content);
  alert("✅ 文件已保存！");
  renderTree();
}

// 搜索文件
function filterFiles(keyword) {
  const files = document.querySelectorAll(".file");
  files.forEach(file => {
    const name = file.textContent.trim();
    file.style.display = name.includes(keyword) ? "flex" : "none";
  });
}

// 切换侧边栏（移动端适配）
function toggleSidebar() {
  const sidebar = document.querySelector(".sidebar");
  sidebar.style.display = sidebar.style.display === "none" ? "block" : "none";
}

// 初始化
window.onload = function() {
  initData();
};
</script>
</body>
</html>
