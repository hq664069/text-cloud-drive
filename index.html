<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的文本云盘</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f7f8fa}
#sidebar{height:100vh;border-right:1px solid #ddd;padding:12px;background:#fff;overflow-y:auto}
#editor{padding:20px}
#formatBar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding:8px;border:1px solid #eee;border-radius:6px;background:#fff}
#formatBar button,#formatBar select{font-size:14px;padding:4px 8px}
#toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#title{font-size:18px}
#content{
  min-height:300px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
}
#codeEditor{
  display:none;
  margin-top:10px;
}
#codeArea{
  width:100%;
  height:220px;
  font-family: monospace;
  font-size:14px;
  padding:10px;
  border-radius:6px;
}
.folder{cursor:pointer;font-weight:500;margin:6px 0}
.note{cursor:pointer;padding-left:12px;color:#444}
.note.active{color:#0d6efd;font-weight:bold}
.file-item{padding-left:12px;color:#555}
.upload-area{
  border:2px dashed #ccc;
  padding:16px;
  text-align:center;
  border-radius:8px;
  margin:10px 0;
  cursor:pointer;
}

.img-thumb {
  max-width: 120px;
  max-height: 120px;
  margin: 4px;
  cursor: pointer;
  border: 2px solid transparent;
}
.img-thumb:hover {
  border-color: #0d6efd;
}
.img-wrap {
  display: inline-block;
  position: relative;
  cursor: move;
  vertical-align: middle;
}

#imgModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#imgModal img {
  max-width: 90%;
  max-height: 90%;
}
#imgModal .close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: #fff;
  font-size: 36px;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="imgModal">
  <span class="close" onclick="closeModal()">&times;</span>
  <img id="modalImg" src="" alt="预览大图">
</div>

<div class="row g-0">
  <div class="col-4 col-md-3" id="sidebar">
    <div class="d-flex gap-2 mb-3 flex-wrap">
      <button class="btn btn-sm btn-outline-primary" onclick="newFolder()">📁 目录</button>
      <button class="btn btn-sm btn-outline-success" onclick="newNote()">📄 笔记</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleFileUpload()">📤 上传</button>
    </div>

    <div id="uploadArea" class="upload-area d-none" onclick="triggerFileUpload()">
      点击上传文件
    </div>

    <div id="tree" class="mt-3"></div>
  </div>

  <div class="col-8 col-md-9" id="editor">
    <div id="toolbar">
      <button class="btn btn-sm btn-primary" onclick="saveNote()">💾 保存</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="insertPhoto()">🖼️ 插入图片</button>
      <button class="btn btn-sm btn-outline-dark" onclick="toggleCodeEditor()"></> 代码编辑</button>
      <button class="btn btn-sm btn-outline-danger" onclick="deleteNote()">🗑️ 删除</button>
    </div>

    <div id="formatBar">
      <select id="fontSizeSel" onchange="setFontSize()">
        <option value="12">12px</option>
        <option value="14" selected>14px</option>
        <option value="16">16px</option>
        <option value="18">18px</option>
        <option value="20">20px</option>
        <option value="24">24px</option>
        <option value="28">28px</option>
        <option value="32">32px</option>
      </select>
      <input type="color" id="fontColor" value="#000000" onchange="setFontColor()">
      <button onclick="document.execCommand('bold')">B 加粗</button>
      <button onclick="document.execCommand('italic')"><i>I 斜体</i></button>
      <button onclick="document.execCommand('justifyLeft')">⬅ 左对齐</button>
      <button onclick="document.execCommand('justifyCenter')">↔ 居中</button>
      <button onclick="document.execCommand('justifyRight')">➡ 右对齐</button>
    </div>

    <input id="title" class="form-control mb-2" placeholder="笔记标题">
    <div id="content" class="border p-3 bg-white" contenteditable="true"></div>

    <div id="codeEditor" class="mt-3">
      <textarea id="codeArea" class="form-control" placeholder="在这里编写代码..."></textarea>
      <button class="btn btn-sm btn-outline-primary mt-2" onclick="insertCodeIntoNote()">插入代码到笔记</button>
    </div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" class="d-none">
<input type="file" id="fileUploadInput" multiple class="d-none">

<script>
let currentPath = ""
let tree = {}
let dragEl = null

// 直接读写本地模拟 KV（存在浏览器 localStorage，简单又稳定）
function saveToLocal(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}
function loadFromLocal(key) {
  const data = localStorage.getItem(key);
  return data ? JSON.parse(data) : null;
}

// 初始化目录树
function initTree() {
  if (!loadFromLocal("tree")) {
    saveToLocal("tree", {});
  }
  tree = loadFromLocal("tree");
}

async function loadTree() {
  tree = loadFromLocal("tree") || {};
  renderTree();
}

function renderTree() {
  const div = document.getElementById("tree")
  div.innerHTML = ""
  for (const folder in tree) {
    const fd = document.createElement("div")
    fd.className = "folder"
    fd.innerText = "📁 " + folder
    div.appendChild(fd)

    const list = tree[folder]
    if (!list) continue
    list.forEach(item => {
      if (item.type === "note") {
        const ne = document.createElement("div")
        ne.className = "note"
        ne.innerText = item.name
        ne.onclick = () => openNote(folder, item.name)
        fd.appendChild(ne)
      }
      if (item.type === "file") {
        const fi = document.createElement("div")
        fi.className = "file-item"
        fi.innerText = "📎 " + item.name
        fd.appendChild(fi)
      }
    })
  }
}

function newFolder() {
  const name = prompt("输入目录名称：")
  if (!name) return
  if (!tree[name]) {
    tree[name] = [];
    saveToLocal("tree", tree);
    loadTree();
  }
}

function newNote() {
  const folder = prompt("放入哪个目录：")
  if (!folder) return
  const name = prompt("笔记名称：")
  if (!name) return
  if (!tree[folder]) {
    tree[folder] = [];
  }
  const exists = tree[folder].some(item => item.name === name);
  if (!exists) {
    tree[folder].push({ type: "note", name });
    saveToLocal("tree", tree);
    saveToLocal(`note:${folder}:${name}`, "");
    loadTree();
  }
}

async function openNote(folder, name) {
  currentPath = folder + "/" + name
  document.getElementById("title").value = name
  document.getElementById("content").innerHTML = loadFromLocal(`note:${folder}:${name}`) || ""
  setActiveNote(name)
}

async function saveNote() {
  if (!currentPath) return alert("请先打开笔记")
  const [folder, name] = currentPath.split("/");
  const content = document.getElementById("content").innerHTML
  saveToLocal(`note:${folder}:${name}`, content);
  alert("✅ 保存成功")
}

function insertPhoto() {
  const inp = document.getElementById("photoInput")
  inp.onchange = e => {
    const file = e.target.files[0]
    const reader = new FileReader()
    reader.onload = ev => {
      const src = ev.target.result
      const wrap = document.createElement("span")
      wrap.className = "img-wrap"
      wrap.draggable = true

      const img = document.createElement("img")
      img.src = src
      img.className = "img-thumb"
      img.onclick = () => openModal(src)

      wrap.appendChild(img)
      document.getElementById("content").appendChild(wrap)
    }
    reader.readAsDataURL(file)
  }
  inp.click()
}

function openModal(src) {
  const modal = document.getElementById("imgModal")
  const modalImg = document.getElementById("modalImg")
  modalImg.src = src
  modal.style.display = "flex"
}
function closeModal() {
  document.getElementById("imgModal").style.display = "none"
}
document.getElementById("imgModal").addEventListener("click", function(e){
  if(e.target === this) closeModal()
})

function initDragSort() {
  const content = document.getElementById("content")
  content.addEventListener("dragstart", e => {
    if(e.target.closest(".img-wrap")){
      dragEl = e.target.closest(".img-wrap")
      e.dataTransfer.setData("text","")
    }
  })
  content.addEventListener("dragover", e => {
    e.preventDefault()
    const targetWrap = e.target.closest(".img-wrap")
    if(dragEl && targetWrap && dragEl !== targetWrap){
      const rect = targetWrap.getBoundingClientRect()
      const midX = rect.left + rect.width / 2
      if(e.clientX < midX){
        targetWrap.before(dragEl)
      }else{
        targetWrap.after(dragEl)
      }
    }
  })
  content.addEventListener("dragend", () => {
    dragEl = null
  })
}

function toggleCodeEditor() {
  const box = document.getElementById("codeEditor")
  box.style.display = box.style.display === "none" ? "block" : "none"
}

function insertCodeIntoNote() {
  const code = document.getElementById("codeArea").value
  const pre = document.createElement("pre")
  pre.style.background = "#f5f5f5"
  pre.style.padding = "10px"
  pre.style.borderRadius = "6px"
  pre.style.overflowX = "auto"
  pre.innerText = code
  document.getElementById("content").appendChild(pre)
}

async function deleteNote() {
  if (!currentPath) return
  if (!confirm("确定删除该笔记？")) return
  const [folder, name] = currentPath.split("/")
  localStorage.removeItem(`note:${folder}:${name}`);
  if (tree[folder]) {
    tree[folder] = tree[folder].filter(item => item.name !== name);
    saveToLocal("tree", tree);
  }
  document.getElementById("title").value = ""
  document.getElementById("content").innerHTML = ""
  currentPath = ""
  loadTree()
}

function toggleFileUpload() {
  const area = document.getElementById("uploadArea")
  area.classList.toggle("d-none")
}
function triggerFileUpload() {
  document.getElementById("fileUploadInput").click()
}
document.getElementById("fileUploadInput").onchange = async e => {
  const folder = prompt("文件上传到哪个目录？")
  if (!folder) return
  for (const file of e.target.files) {
    const reader = new FileReader()
    reader.onload = ev => {
      const src = ev.target.result
      if (!tree[folder]) {
        tree[folder] = [];
      }
      const exists = tree[folder].some(item => item.name === file.name);
      if (!exists) {
        tree[folder].push({ type: "file", name: file.name });
        saveToLocal("tree", tree);
      }
      alert("✅ 文件上传完成");
      loadTree();
    }
    reader.readAsDataURL(file)
  }
}

function setActiveNote(name) {
  document.querySelectorAll(".note").forEach(n => n.classList.remove("active"))
  document.querySelectorAll(".note").forEach(n => {
    if (n.innerText === name) n.classList.add("active")
  })
}

function setFontSize() {
  const size = document.getElementById("fontSizeSel").value
  document.execCommand('fontSize', false, size)
}
function setFontColor() {
  const color = document.getElementById("fontColor").value
  document.execCommand('foreColor', false, color)
}

// 页面加载时初始化
window.onload = function(){
  initTree();
  loadTree();
  initDragSort();
}
</script>
</body>
</html>
